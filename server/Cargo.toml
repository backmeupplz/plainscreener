[package]
name = "plainscreener"
description = "Base DEX indexer and web server for plainscreener.com"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chart = { path = "../chart" }
fjall = "3"
imagesize = "0.15"
mimalloc = "0.1"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "raster-images"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
