name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["*.md"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Our pushes and PRs run on the Mac runners with a persistent target dir; outsider PRs run on Linux.
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude","radiant"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Persistent target dir (Mac)
        if: runner.os == 'macOS'
        run: |
          d="$RUNNER_TOOL_CACHE/plainscreener-target"
          [ ! -d "$d" ] || [ "$(du -sm "$d" | cut -f1)" -lt 10000 ] || rm -rf "$d"
          echo "CARGO_TARGET_DIR=$d" >> "$GITHUB_ENV"
          src="$RUNNER_TOOL_CACHE/plainscreener-src"
          mkdir -p "$src"
          rsync -rlpc --delete --exclude /.git --exclude /target ./ "$src/"
          echo "SRC=$src" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo-home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: runner.os == 'Linux'
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.os == 'Linux'
      - name: Clippy and tests
        run: |
          cd "${SRC:-.}"
          rustc --version
          # The server embeds the chart wasm; the Docker build makes the real one, tests don't need it.
          [ -f web/chart.wasm ] || : > web/chart.wasm
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}/clippy" cargo clippy --locked --workspace --all-targets -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1 &
          clippy=$!
          cargo test --locked --workspace --no-run
          ok=0
          wait $clippy || ok=1; cat "$RUNNER_TEMP/clippy.log"
          [ $ok = 0 ]
          cargo test --locked --workspace
